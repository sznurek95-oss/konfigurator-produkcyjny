# Kontrola pull requestów: strefa zmian, testy całego konfiguratora i zdjęcia „przed / po” z trybu prezentacji.
# Instalator nie powstaje tutaj — dopiero po scaleniu do main (instalator.yml).
name: Kontrola zmian

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g typescript@5

      # Strażnik z gałęzi main (nie z pull requesta), żeby zmiany w PR nie mogły go osłabić.
      - name: Strefa zmian (tryb prezentacji)
        run: |
          git show origin/main:tools/strefa_prezentacji.py > "$RUNNER_TEMP/strefa.py"
          python3 "$RUNNER_TEMP/strefa.py" --baza origin/main

      - name: Budowanie strony
        id: build
        run: python3 tools/build.py
      - name: Testy modeli i układów
        run: node --test tests/*.test.js

      - name: Przeglądarka do testów
        run: |
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium
      - name: Test interfejsu (każda funkcja raz)
        run: python3 tools/test_interfejsu.py
      - name: Pliki do druku identyczne jak w wersji wzorcowej
        run: python3 tools/porownaj_ze_stara.py

      - name: Zdjęcia z trybu prezentacji (przed / po)
        # także gdy testy nie przeszły — ale tylko jeśli strona się zbudowała
        if: always() && steps.build.outcome == 'success'
        run: python3 tools/prezentacja/podglad.py
      - name: Porównanie do pobrania
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zdjecia-prezentacji
          path: |
            build/prezentacja/porownanie.html
            build/prezentacja/po/
            docs/prezentacja/przed/
          retention-days: 30
